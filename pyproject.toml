[project]
name = "infosys-backend"
version = "0.1.0"
description = "Backend de infosys"
authors = [
    { name = "Fernando Vazquez", email = "fernandovazquez.favm@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "asyncpg>=0.30.0",
    "pydantic-settings>=2.7.0",
    "duckdb>=1.5.5",
    "email-validator>=2.3.0",
    "python-multipart>=0.0.32",
    "pandas>=3.0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
sat-blacklist-import = "app.sat.importer:main"
estate-generate = "app.estate_generator.cli:main"
fraud-replay = "app.fraud.engine.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.1",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = [
    "app/fraud/engine/validate_format.py",
    "public/material/validate_format.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Ported verbatim; these fixes would alter strings, iteration, or control flow.
"app/fraud/engine/*.py" = ["E501", "B905", "C416", "RUF005", "SIM114"]
# Ported verbatim; long lines are SQL whose bytes and semantics are preserved.
"app/fraud/rules/**/*.py" = ["E501"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = []

# asyncpg ships no py.typed marker, so its types resolve to Any.
[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# Ported verbatim, kept untyped.
[[tool.mypy.overrides]]
module = ["app.fraud.engine.*", "app.fraud.rules.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
warn_return_any = false
disable_error_code = [
    "arg-type",
    "index",
    "list-item",
    "return-value",
    "var-annotated",
]

[[tool.mypy.overrides]]
module = "app.fraud.engine.validate_format"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
